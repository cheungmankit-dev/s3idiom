                    { word: "適得其反", exp: "結果與原先的期望恰好相反。", origin: "清．魏源《陔餘叢考》", story: "本來希望事情能夠有好的發展或達到某個目標，卻因為方法不當，導致最後的結果跟預期的完全相反。" },
                    { word: "頓開茅塞", exp: "比喻忽然領悟，心思豁然開朗。", origin: "明．吳承恩《三國演義》", story: "「茅塞」比喻思路被茅草堵塞。聽了別人的一席話或經歷某事後，原本堵塞的思路突然打開，一下子明白了其中的道理。" },
                    { word: "當頭棒喝", exp: "比喻使人猛醒的勸告或警告。", origin: "宋．釋普濟《五燈會元》", story: "原為佛教禪宗的一種教學方法，師父用棒打或大聲呵斥來點醒執迷不悟的弟子。後泛指促使人猛然醒悟的嚴厲警告。" },
                    { word: "針鋒相對", exp: "比喻雙方言行銳利，互不相讓。", origin: "宋．釋道原《景德傳燈錄》", story: "針尖對著麥芒。形容雙方在觀點、立場或行動上對立激烈，態度尖銳，誰也不肯退讓半步。" },
                    { word: "過眼雲煙", exp: "比喻事物容易消逝，不留痕跡。", origin: "宋．蘇軾《答任師中家漢公》", story: "就像從眼前飄過的雲彩與煙霧一樣，很快就消散不見了。多用來比喻榮華富貴、功名利祿等事物虛幻無常，轉瞬即逝。" },
                    { word: "飽經風霜", exp: "比喻經歷過很多艱難困苦。", origin: "清．曹雪芹《紅樓夢》", story: "「風霜」比喻生活中的艱難與困苦。形容一個人一生中經歷了極多的波折與磨難，經驗豐富且顯得歷盡滄桑。" },
                    { word: "意氣風發", exp: "形容精神振奮，志氣昂揚。", origin: "現代成語", story: "「意氣」指意志和氣概；「風發」指煥發。形容人面對挑戰或取得成就時，精神抖 গৌ，充滿了自信與昂揚的鬥志。" },
                    { word: "義無反顧", exp: "本著正義勇往直前，絕不退縮。", origin: "《漢書．司馬相如傳》", story: "「反顧」指回頭看。只要確認自己做的事情是正義的、正確的，就勇敢地一直向前走，絕不後悔退縮。" },
                    { word: "義憤填膺", exp: "胸中充滿因正義而激起的憤怒。", origin: "清．曾樸《官場現形記》", story: "「膺」是指胸膛。形容看到不公不義的事情時，心中充滿了強烈的憤怒，氣得胸膛都要炸開了。" },
                    { word: "煙消雲散", exp: "比喻事物消失得乾乾淨淨。", origin: "元．鄭廷玉《楚昭公》", story: "像煙霧和雲彩被風吹散一樣。多用來形容疑慮、愁悶、怨恨或某種事物完全消失，不留一點痕跡。" },
                    { word: "滄海桑田", exp: "比喻世事變化很大。", origin: "晉．葛洪《神仙傳》", story: "仙人麻姑說她曾親眼看見東海三次變成桑田（農田）。後用「滄海桑田」比喻人世間的事物變化極大，令人感嘆。" },
                    { word: "塞翁失馬", exp: "比喻禍福時常互轉，不能一時定論。", origin: "《淮南子．人間訓》", story: "邊塞一老翁走失了馬，別人安慰他，他說「怎知不是福？」後來馬帶回一匹好馬；他兒子騎馬摔斷腿，卻因此躲過兵役保住性命。比喻壞事也可能變成好事。" },
                    { word: "隔岸觀火", exp: "比喻對別人的危難不加援手而在旁看熱鬧。", origin: "唐．乾康《投謁齊己》", story: "隔著河岸看對岸失火。比喻在別人遇到危險或災難時，自己採取袖手旁觀的態度，甚至幸災樂禍，不肯伸出援手。" },
                    { word: "夢寐以求", exp: "睡夢中都在尋找。形容願望非常迫切。", origin: "《詩經．周南．關雎》", story: "「夢寐」指睡眠。形容對某個人或某種事物渴望到了極點，連睡覺做夢的時候都在追求、期盼著它能實現。" },
                    { word: "熙來攘往", exp: "形容行人來來往往，非常擁擠。", origin: "《史記．貨殖列傳》", story: "「熙熙」、「攘攘」皆為熱鬧擁擠的樣子。形容街道、市場等地方人潮川流不息，非常繁華熱鬧。" },
                    { word: "爐火純青", exp: "比喻學問、技術、功夫到達純熟完美的境界。", origin: "唐．孫思邈《四言詩》", story: "道家煉丹時，認為爐火的火候到了發出純青色火焰時，丹藥就煉成了。後用來讚美人的技藝、學問達到了最高、最純熟的境界。" },
                    { word: "輕描淡寫", exp: "形容說話或寫文章時對重要的事情輕輕帶過。", origin: "清．吳趼人《二十年目睹之怪現狀》", story: "原為繪畫的一種技法。後用來比喻說話或寫作時，對於本來應該重點著墨或非常嚴重的問題，故意說得無足輕重，輕輕帶過。" },
                    { word: "對症下藥", exp: "比喻針對事物問題的癥結，採取適當的處理方法。", origin: "《三國志．魏書．華佗傳》", story: "名醫華佗給兩個病徵相同的病人開了不同的藥，因為他知道兩人發病的根本原因不同。比喻針對具體問題，採取最有效的解決辦法。" },
                    { word: "暢所欲言", exp: "痛痛快快地把心裡想說的話全都說出來。", origin: "清．李汝珍《鏡花緣》", story: "「暢」是盡情、痛快。形容在會議或交談中，毫無顧忌，盡情地發表自己的觀點和意見。" },
                    { word: "與世長辭", exp: "指人去世。", origin: "明．吳承恩《三國演義》", story: "「長辭」是指永遠告別。這是對人死亡的一種委婉、莊重的說法，表示永遠離開了這個世界。" }
                ],
                test1: [
                    { q: "適得其＿", options: ["返", "反", "犯", "泛"], ans: 1, base: "適得其反" },
                    { q: "頓開＿塞", options: ["毛", "矛", "茅", "卯"], ans: 2, base: "頓開茅塞" },
                    { q: "當頭棒＿", options: ["嚇", "渴", "褐", "喝"], ans: 3, base: "當頭棒喝" },
                    { q: "針鋒相＿", options: ["對", "隊", "兌", "退"], ans: 0, base: "針鋒相對" },
                    { q: "過眼雲＿", options: ["淵", "煙", "淹", "燕"], ans: 1, base: "過眼雲煙" },
                    { q: "飽經風＿", options: ["雙", "箱", "霜", "傷"], ans: 2, base: "飽經風霜" },
                    { q: "意氣風＿", options: ["法", "伐", "乏", "發"], ans: 3, base: "意氣風發" },
                    { q: "義無反＿", options: ["顧", "固", "故", "孤"], ans: 0, base: "義無反顧" },
                    { q: "義憤填＿", options: ["鷹", "膺", "英", "櫻"], ans: 1, base: "義憤填膺" },
                    { q: "煙消雲＿", options: ["傘", "閃", "散", "山"], ans: 2, base: "煙消雲散" },
                    { q: "滄海桑＿", options: ["填", "甜", "天", "田"], ans: 3, base: "滄海桑田" },
                    { q: "塞翁失＿", options: ["馬", "碼", "瑪", "媽"], ans: 0, base: "塞翁失馬" },
                    { q: "隔岸觀＿", options: ["伙", "火", "禍", "夥"], ans: 1, base: "隔岸觀火" },
                    { q: "夢＿以求", options: ["媚", "昧", "寐", "味"], ans: 2, base: "夢寐以求" },
                    { q: "熙來＿往", options: ["壤", "嚷", "讓", "攘"], ans: 3, base: "熙來攘往" },
                    { q: "爐火純＿", options: ["青", "清", "輕", "傾"], ans: 0, base: "爐火純青" },
                    { q: "輕＿淡寫", options: ["瞄", "描", "貓", "茅"], ans: 1, base: "輕描淡寫" },
                    { q: "對＿下藥", options: ["證", "正", "症", "政"], ans: 2, base: "對症下藥" },
                    { q: "暢所欲＿", options: ["炎", "延", "顏", "言"], ans: 3, base: "暢所欲言" },
                    { q: "與世長＿", options: ["辭", "詞", "慈", "池"], ans: 0, base: "與世長辭" }
                ],
                test3: [
                    { q: "原本想嚴格管教孩子讓他進步，沒想到方法不對，反而____，讓他更加反叛。", options: ["頓開茅塞", "適得其反", "意氣風發", "夢寐以求"], ans: 1, base: "適得其反" },
                    { q: "聽了老師的詳細解說，我____，終於明白了這道數學題的解法。", options: ["過眼雲煙", "隔岸觀火", "頓開茅塞", "與世長辭"], ans: 2, base: "頓開茅塞" },
                    { q: "這場意外對他來說有如____，讓他徹底醒悟，不再沉迷賭博。", options: ["針鋒相對", "滄海桑田", "熙來攘往", "當頭棒喝"], ans: 3, base: "當頭棒喝" },
                    { q: "在辯論比賽中，雙方代表____，互不相讓，場面非常激烈。", options: ["針鋒相對", "飽經風霜", "爐火純青", "對症下藥"], ans: 0, base: "針鋒相對" },
                    { q: "對他而言，過去的榮華富貴都不過是____，現在最重要的是家人的健康。", options: ["塞翁失馬", "過眼雲煙", "暢所欲言", "義無反顧"], ans: 1, base: "過眼雲煙" },
                    { q: "這位老爺爺臉上的皺紋，顯示他是一位____的人。", options: ["意氣風發", "輕描淡寫", "飽經風霜", "煙消雲散"], ans: 2, base: "飽經風霜" },
                    { q: "畢業典禮上，同學們個個____，對未來的挑戰充滿信心。", options: ["隔岸觀火", "與世長辭", "適得其反", "意氣風發"], ans: 3, base: "意氣風發" },
                    { q: "為了追求理想，他____地辭去了高薪工作，決定自己創業。", options: ["義無反顧", "夢寐以求", "頓開茅塞", "過眼雲煙"], ans: 0, base: "義無反顧" },
                    { q: "看到新聞裡有無辜市民受傷，大家都感到____，要求警方嚴懲凶手。", options: ["熙來攘往", "義憤填膺", "針鋒相對", "塞翁失馬"], ans: 1, base: "義憤填膺" },
                    { q: "當誤會解釋清楚後，他們兩人之間的不快立刻____了。", options: ["爐火純青", "當頭棒喝", "煙消雲散", "飽經風霜"], ans: 2, base: "煙消雲散" },
                    { q: "短短十年間，這個小漁村已經發展成現代化城市，真是____啊！", options: ["對症下藥", "意氣風發", "輕描淡寫", "滄海桑田"], ans: 3, base: "滄海桑田" },
                    { q: "這次比賽雖然輸了，但也讓你認清了自己的弱點，正所謂____，下次一定會更好。", options: ["塞翁失馬", "暢所欲言", "義無反顧", "與世長辭"], ans: 0, base: "塞翁失馬" },
                    { q: "朋友有難，我們應該挺身而出，怎麼可以____呢？", options: ["義憤填膺", "隔岸觀火", "適得其反", "頓開茅塞"], ans: 1, base: "隔岸觀火" },
                    { q: "能考上這所世界頂尖的大學，是他____的願望。", options: ["煙消雲散", "針鋒相對", "夢寐以求", "過眼雲煙"], ans: 2, base: "夢寐以求" },
                    { q: "假日的旺角街頭____，到處都是逛街購物的市民。", options: ["飽經風霜", "滄海桑田", "當頭棒喝", "熙來攘往"], ans: 3, base: "熙來攘往" },
                    { q: "他的廚藝已經達到了____的境界，隨便煮一道菜都令人回味無窮。", options: ["爐火純青", "隔岸觀火", "塞翁失馬", "意氣風發"], ans: 0, base: "爐火純青" },
                    { q: "他對自己犯下的大錯竟然____，似乎一點也不覺得內疚。", options: ["義無反顧", "輕描淡寫", "夢寐以求", "暢所欲言"], ans: 1, base: "輕描淡寫" },
                    { q: "處理學生的行為問題，必須先了解背後的原因，才能____。", options: ["熙來攘往", "義憤填膺", "對症下藥", "適得其反"], ans: 2, base: "對症下藥" },
                    { q: "這次班會旨在收集意見，請大家放下顧慮，____。", options: ["爐火純青", "煙消雲散", "頓開茅塞", "暢所欲言"], ans: 3, base: "暢所欲言" },
                    { q: "這位對社會貢獻良多的老校長，於昨晚安詳地____，令人惋惜。", options: ["與世長辭", "輕描淡寫", "過眼雲煙", "滄海桑田"], ans: 0, base: "與世長辭" }
                ]
            },
            3: {
                title: "第三學期",
                idioms: [
                    { word: "語重心長", exp: "言辭誠懇，情意深長。", origin: "清．洛日生《海國英雄記》", story: "形容長輩、老師或朋友在勸告或指導別人時，言語非常真誠懇切，充滿了深厚的關愛與期望。" },
                    { word: "旗鼓相當", exp: "比喻雙方勢均力敵。", origin: "《後漢書．隗囂傳》", story: "古時作戰，擊鼓進軍，建旗為號。兩軍的軍旗與戰鼓氣勢不相上下，比喻比賽或競爭中雙方的實力非常接近，難分勝負。" },
                    { word: "慷慨解囊", exp: "毫不吝嗇地拿出錢財幫助別人。", origin: "清．吳趼人《二十年目睹之怪現狀》", story: "「慷慨」指大方；「囊」是錢袋。形容人非常有同情心和正義感，在別人遇到困難時，毫不猶豫地捐出金錢來援助。" },
                    { word: "滴水穿石", exp: "比喻有志者事竟成，只要努力不懈就能成功。", origin: "宋．羅大經《鶴林玉露》", story: "水滴雖然微小，但只要日積月累地滴在同一塊石頭上，最終也能把石頭滴穿。比喻做事情只要堅持不懈，再大的困難也能克服。" },
                    { word: "熱淚盈眶", exp: "形容非常感動或激動。", origin: "現代成語", story: "「盈眶」指充滿眼眶。形容人在聽到感人的故事、見到久別的親人，或獲得巨大成功時，激動得眼淚充滿了眼眶。" },
                    { word: "敷衍塞責", exp: "做事不負責任，應付了事。", origin: "清．張集馨《道咸宦海見聞錄》", story: "「敷衍」指馬虎應付；「塞責」指搪塞責任。形容人對待工作或任務毫無熱誠，隨隨便便做完，只為了向上面交差。" },
                    { word: "鴉雀無聲", exp: "形容非常安靜。", origin: "宋．釋道原《景德傳燈錄》", story: "連烏鴉和麻雀的叫聲都沒有。形容現場極其安靜，一點聲音也聽不到，多用來形容人群在等待或受震懾時的寂靜。" },
                    { word: "暴殄天物", exp: "比喻糟蹋物品，不知愛惜。", origin: "《尚書．武成》", story: "「殄」是滅絕；「天物」指大自然賜予的物產。原指殘害滅絕自然界的生物，後泛指任意浪費、糟蹋糧食或物品。" },
                    { word: "銷聲匿跡", exp: "形容隱藏起來或不公開出現。", origin: "宋．孫光憲《北夢瑣言》", story: "「銷」是消除；「匿」是隱藏。指不再發出聲音，也不暴露行蹤。形容人或事物退出社會舞台，完全隱蔽起來。" },
                    { word: "鋒芒畢露", exp: "比喻人好表現自己，愛銳氣外露。", origin: "現代成語", story: "刀劍的尖端和邊刃全都露了出來。比喻人的才華、銳氣完全顯露在外，不懂得謙虛收斂，容易招惹別人的嫉妒或反感。" },
                    { word: "廢寢忘食", exp: "形容專心努力工作或學習。", origin: "《論語．述而》", story: "孔子形容自己發憤學習時：「發憤忘食，樂以忘憂。」後演變為「廢寢忘食」，形容人為了做某件事專心到了極點，連睡覺和吃飯都忘了。" },
                    { word: "潛移默化", exp: "人的思想、性格受環境影響而不知不覺發生變化。", origin: "北齊．顏之推《顏氏家訓》", story: "「潛」是暗中。指人的思想、性格或習慣，在周圍環境或他人的長期薰陶下，不知不覺、默默地發生了改變。" },
                    { word: "潰不成軍", exp: "軍隊被打得七零八落，潰敗逃散。", origin: "現代成語", story: "軍隊遭到極其沉重的打擊，士兵四處逃散，已經無法維持完整的軍隊編制。形容在比賽或鬥爭中遭到徹底的慘敗。" },
                    { word: "推己及人", exp: "將心比心，設身處地為別人著想。", origin: "《論語．衛靈公》", story: "孔子提倡的「恕」道，即「己所不欲，勿施於人」。用自己的心意去推想別人的心意，體會別人的感受，設身處地為他人著想。" },

                    { q: "敵軍遭到我方連夜突襲，被打得____，丟盔棄甲而逃。", options: ["滴水穿石", "潰不成軍", "融會貫通", "鍥而不捨"], ans: 1, base: "潰不成軍" },
                    { q: "我們在社會上為人處事，應該懂得____，多替別人的難處著想。", options: ["鋒芒畢露", "學步邯鄲", "推己及人", "頭昏腦脹"], ans: 2, base: "推己及人" },
                    { q: "只有把課本的知識與生活經驗____，才算是真正的學習。", options: ["優柔寡斷", "潛移默化", "熱淚盈眶", "融會貫通"], ans: 3, base: "融會貫通" },
                    { q: "這幾天連續熬夜趕工，讓我感到____，無法集中精神。", options: ["頭昏腦脹", "躊躇滿志", "廢寢忘食", "潰不成軍"], ans: 0, base: "頭昏腦脹" },
                    { q: "寫作要有自己的風格，盲目抄襲別人的手法，只會落得____的下場。", options: ["推己及人", "學步邯鄲", "暴殄天物", "敷衍塞責"], ans: 1, base: "學步邯鄲" },
                    { q: "身為團隊的領導者，遇到突發事件時必須果斷，絕不能____。", options: ["鍥而不捨", "融會貫通", "優柔寡斷", "慷慨解囊"], ans: 2, base: "優柔寡斷" },
                    { q: "科學研究的道路充滿困難，只有____的人，才能抵達成功的彼岸。", options: ["優柔寡斷", "學步邯鄲", "頭昏腦脹", "鍥而不捨"], ans: 3, base: "鍥而不捨" },
                    { q: "拿著剛收到的名牌大學錄取通知書，他____地向家人報喜。", options: ["躊躇滿志", "銷聲匿跡", "鴉雀無聲", "潛移默化"], ans: 0, base: "躊躇滿志" }
                ]
            }
        };

        let currentTerm = 1;
        let currentMode = 'study';
        let activeTestQuestions = [];

        // ==========================================
        // 核心邏輯
        // ==========================================
        
        // 陣列洗牌函數
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        // 開關典故視窗
        function openModal(termIdx, idiomIdx) {
            const item = termData[termIdx].idioms[idiomIdx];
            document.getElementById('modal-word').innerText = item.word;
            document.getElementById('modal-exp').innerText = item.exp;
            document.getElementById('modal-origin').innerText = item.origin;
            document.getElementById('modal-story').innerText = item.story;
            document.getElementById('idiom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('idiom-modal').classList.add('hidden');
        }

        // 切換學期
        function selectTerm(term) {
            currentTerm = term;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${term}`).classList.add('active');
            renderContent();
        }

        // 切換模式
        function selectMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
            renderContent();
        }

        // 渲染主要畫面
        function renderContent() {
            const area = document.getElementById('content-area');
            area.innerHTML = ''; 
            const data = termData[currentTerm];

            // 模式：自學
            if (currentMode === 'study') {
                let html = `<h2 class="text-2xl font-bold mb-4 text-blue-900">${data.title} - 成語自學區 <span class="text-base text-gray-500 font-normal">(點擊卡片可放大看典故)</span></h2><div class="grid md:grid-cols-2 gap-6">`;
                data.idioms.forEach((item, index) => {
                    html += `
                    <div onclick="openModal(${currentTerm}, ${index})" class="idiom-card bg-blue-50 border-l-4 border-blue-600 p-5 rounded shadow-sm flex flex-col justify-between cursor-pointer transition">
                        <div>
                            <h3 class="text-xl font-bold text-gray-800 flex items-center justify-between">
                                ${item.word}
                                <span class="text-xs bg-blue-200 text-blue-900 px-2 py-1 rounded font-normal">🔍 點我看典故</span>
                            </h3>
                            <p class="text-gray-700 mt-2 line-clamp-2"><strong>解釋：</strong>${item.exp}</p>
                        </div>
                    </div>`;
                });
                html += `</div>`;
                area.innerHTML = html;
            
            // 模式：測驗
            } else if (currentMode === 'test1' || currentMode === 'test2' || currentMode === 'test3') {
                let pool = [];
                let title = "";
                
                if (currentMode === 'test1') {
                    pool = data.test1;
                    title = "測驗一：字詞辨識 (選出缺少的正確字詞)";
                } else if (currentMode === 'test3') {
                    pool = data.test3;
                    title = "測驗三：成語應用 (選出適合句子的成語)";
                } else if (currentMode === 'test2') {
                    // 測驗二：動態生成成語配對題庫
                    title = "測驗二：成語配對 (根據解釋選出正確的成語)";
                    let allIdioms = data.idioms;
                    pool = allIdioms.map(item => {
                        let wrongOptions = allIdioms.filter(x => x.word !== item.word);
                        wrongOptions = shuffleArray([...wrongOptions]).slice(0, 3).map(x => x.word);
                        let options = [item.word, ...wrongOptions];
                        options = shuffleArray(options);
                        return {
                            q: `請問「<span class="text-blue-800 font-bold">${item.exp}</span>」是以下哪一個成語的解釋？`,
                            options: options,
                            ans: options.indexOf(item.word),
                            base: item.word
                        };
                    });
                }

                if(pool.length === 0) {
                    area.innerHTML = `<p class="text-gray-500 text-center py-10">此學期的測驗題目尚待擴充。</p>`;
                    return;
                }

                // 去重複抽題機制：確保10題對應10個不同的成語 (base 不重複)
                let shuffledPool = shuffleArray([...pool]);
                activeTestQuestions = [];
                let usedBase = new Set();
                
                for (let t of shuffledPool) {
                    if (!usedBase.has(t.base)) {
                        usedBase.add(t.base);
                        activeTestQuestions.push(t);
                    }
                    if (activeTestQuestions.length === 10) break;
                }
                
                if (activeTestQuestions.length < 10) {
                    for (let t of shuffledPool) {
                        if (activeTestQuestions.length === 10) break;
                        if (!activeTestQuestions.includes(t)) activeTestQuestions.push(t);
                    }
                }
                
                let html = `<h2 class="text-2xl font-bold mb-4 text-blue-900">${data.title} - ${title}</h2>`;
                html += `<p class="text-gray-600 mb-6 bg-yellow-50 p-3 rounded border border-yellow-200 shadow-sm text-sm">💡 系統提示：題目已從題庫隨機抽出，每次測驗皆不相同，且保證10題考核10個不同的成語。滿分為 10 分。</p>`;
                
                // 表單開始
                html += `<form id="quiz-form" onsubmit="submitQuiz(event)" class="space-y-6">`;
                
                // 學生資料輸入區塊
                html += `
                <div class="bg-indigo-50 border border-indigo-200 p-5 rounded-lg mb-6 shadow-sm">
                    <h3 class="font-bold text-indigo-800 mb-3 flex items-center">👤 學生資料 (交卷前必填)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input type="text" id="student-class" placeholder="班別 (例: 3A)" class="p-2.5 rounded border focus:ring-2 focus:ring-indigo-300 outline-none" value="${currentStudent.className}" required>
                        <input type="number" id="student-no" placeholder="學號 (例: 01)" class="p-2.5 rounded border focus:ring-2 focus:ring-indigo-300 outline-none" value="${currentStudent.classNo}" required>
                        <input type="text" id="student-name" placeholder="姓名 (例: Chan Tai Man)" class="p-2.5 rounded border focus:ring-2 focus:ring-indigo-300 outline-none" value="${currentStudent.studentName}" required>
                    </div>
                </div>`;

                // 題目區塊
                activeTestQuestions.forEach((t, index) => {
                    html += `
                    <div class="bg-gray-50 p-5 rounded shadow-sm border border-gray-100 hover:border-blue-300 transition">
                        <p class="text-lg mb-4 leading-relaxed"><strong>${index + 1}.</strong> ${t.q}</p>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
                    t.options.forEach((opt, optIdx) => {
                        html += `
                            <label class="flex items-center p-3 bg-white border rounded shadow-sm cursor-pointer hover:bg-blue-50 hover:border-blue-400 transition">
                                <input type="radio" name="q${index}" value="${optIdx}" class="mr-3 w-4 h-4 text-blue-600 focus:ring-blue-500" required>
                                <span class="font-medium text-gray-800">${opt}</span>
                            </label>`;
                    });
                    html += `</div></div>`;
                });
                
                html += `<button type="submit" id="submit-test-btn" class="w-full bg-blue-700 text-white font-bold py-4 rounded-lg shadow-md hover:bg-blue-800 transition transform hover:scale-[1.01] text-lg mt-4">交卷並看結果！</button>`;
                html += `</form><div id="result-area" class="mt-8 mb-6 text-center"></div>`;
                area.innerHTML = html;
            }
        }

        // 交卷邏輯與傳送成績
        function submitQuiz(e) {
            e.preventDefault();
            
            // 記錄學生資料
            currentStudent.className = document.getElementById('student-class').value;
            currentStudent.classNo = document.getElementById('student-no').value;
            currentStudent.studentName = document.getElementById('student-name').value;

            const form = new FormData(e.target);
            let score = 0;
            let resultDetailsHtml = '<div class="mt-6 space-y-4 text-left text-base font-normal">';

            // 對答案
            activeTestQuestions.forEach((t, index) => {
                const userAnswer = parseInt(form.get(`q${index}`));
                const isCorrect = (userAnswer === t.ans);
                
                if (isCorrect) score += 1; 
                
                let correctText = t.options[t.ans];
                let userText = isNaN(userAnswer) ? "未作答" : t.options[userAnswer];
                let cardClass = isCorrect ? "bg-green-50 border-green-300" : "bg-red-50 border-red-300";
                
                resultDetailsHtml += `
                <div class="p-5 rounded-lg border-2 ${cardClass}">
                    <p class="text-gray-800 mb-3 font-medium">${index + 1}. ${t.q}</p>
                    <div class="flex flex-col sm:flex-row sm:gap-6 gap-2">
                        <p class="text-gray-700">你的答案：<span class="font-bold text-lg ${isCorrect ? 'text-green-700' : 'text-red-600 line-through'}">${userText}</span></p>
                        ${!isCorrect ? `<p class="text-gray-700">正確答案：<span class="font-bold text-lg text-green-700">${correctText}</span></p>` : ''}
                    </div>
                </div>`;
            });
            resultDetailsHtml += '</div>';

            // 準備傳送給 GAS 的資料
            const testNames = { 'test1': '字詞辨識', 'test2': '成語配對', 'test3': '成語應用' };
            const payload = {
                className: currentStudent.className,
                classNo: currentStudent.classNo,
                studentName: currentStudent.studentName,
                term: `中三級 ${currentTerm} 學期`,
                testType: testNames[currentMode],
                score: score,
                maxScore: 10
            };

            // 介面鎖定
            const submitBtn = document.getElementById('submit-test-btn');
            submitBtn.innerText = "成績傳送中，請稍候...";
            submitBtn.disabled = true;
            submitBtn.classList.replace("bg-blue-700", "bg-gray-400");
            submitBtn.classList.replace("hover:bg-blue-800", "hover:bg-gray-400");
            document.querySelectorAll('input[type="radio"], input[type="text"], input[type="number"]').forEach(input => input.disabled = true);

            // 定義顯示最終結果的函數
            const showFinalResult = (fetchMessage = "") => {
                const resultArea = document.getElementById('result-area');
                let scoreMessage = '';
                
                if(score === 10) {
                    scoreMessage = `<div class="text-4xl font-extrabold text-green-600 mb-2">太棒了！你的分數是 ${score} / 10 滿分！🎉</div>`;
                } else if(score >= 6) {
                    scoreMessage = `<div class="text-4xl font-extrabold text-blue-600 mb-2">表現不錯！你的分數是 ${score} / 10。👍</div>`;
                } else {
                    scoreMessage = `<div class="text-4xl font-extrabold text-red-600 mb-2">你的分數是 ${score} / 10。💪</div>`;
                }
                
                let fetchWarningHtml = fetchMessage ? `<p class="text-sm text-yellow-600 bg-yellow-100 p-2 rounded mb-4 inline-block">${fetchMessage}</p>` : '';

                let retryBtnHtml = `
                    <div class="mt-6 mb-8">
                        <button onclick="renderContent()" class="w-full md:w-1/2 mx-auto px-8 bg-green-600 text-white font-bold py-4 rounded-xl hover:bg-green-700 shadow-lg transition transform hover:-translate-y-1 text-lg flex justify-center items-center gap-2">
                            <span>🔄 重新測驗 (抽取全新題目)</span>
                        </button>
                        <p class="text-gray-500 text-sm mt-3">覺得這套題目太簡單？按上面按鈕挑戰新的隨機組合！</p>
                    </div>
                `;

                submitBtn.style.display = 'none';
                resultArea.innerHTML = scoreMessage + fetchWarningHtml + retryBtnHtml + `<h3 class="text-gray-600 mt-6 font-bold text-xl border-b pb-2 text-left">📝 對錯詳情分析</h3>` + resultDetailsHtml;
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            // 執行 Fetch 發送數據
            if (GAS_URL === "在此處貼上你的_GOOGLE_APPS_SCRIPT_網址" || GAS_URL === "") {
                setTimeout(() => {
                    showFinalResult("⚠️ 提示：因為張SIR尚未設定真實的 GAS 網址，本次成績未傳送至後台，但你仍可查看結果！");
                }, 800); 
            } else {
                fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(result => {
                    showFinalResult(); 
                })
                .catch(error => {
                    console.error("Error:", error);
                    showFinalResult("⚠️ 提示：成績傳送至後台失敗，請檢查網絡連線或 GAS 網址部署權限。");
                });
            }
        }

        // 初始化載入
        selectTerm(1);
        selectMode('study');
    </script>
</body>
</html>
